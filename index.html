<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outer Pen</title>
    <style>
        :root {
            --bg-main: #06080c;
            --accent-glow: #A020DF;
            --text-main: #A020DF;
            --text-muted: #9ca3af;
        }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .hero {
            text-align: center;
            max-width: 650px;
            animation: fadeIn 1.2s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0 0 15px 0;
                background: linear-gradient(135deg, #e9d5ff 0%, #A020DF 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
        }

        .tagline {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
            letter-spacing: 0.05em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Outer Pen</h1>
        <p class="tagline">Work In Progress</p>
    </header>

</body>
</html>
