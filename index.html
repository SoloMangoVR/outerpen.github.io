<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outer Pen</title>
    <style>
        :root {
            --bg-main: #06080c;
            --accent-glow: #A020DF;
            --text-main: #A020DF;
            --text-muted: #9ca3af;
        }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .hero {
            text-align: center;
            max-width: 650px;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo layout and styling */
        .hero-logo {
            max-width: 320px; 
            width: 100%;
            height: auto;
            margin-bottom: -65px; /* Aggressively pulls the text much higher up under the logo ring */
        }

        .wip-text {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .discord-promo {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 10px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .discord-btn {
            display: inline-block;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: 600;
            color: #f9fafb;
            text-decoration: none;
            border: 2px solid var(--accent-glow);
            border-radius: 30px;
            background: transparent;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(160, 32, 223, 0.2);
        }

        .discord-btn:hover {
            background: var(--accent-glow);
            color: var(--bg-main);
            box-shadow: 0 0 25px rgba(160, 32, 223, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header class="hero">
        <img src="logo.png" alt="Outer Pen Logo" class="hero-logo">
        <p class="wip-text">Work in Progress</p>
        <p class="discord-promo">Join The Official Outer Pen Discord For Updates</p>
        <a href="https://discord.gg" class="discord-btn" target="_blank">Join Discord Server</a>
    </header>

</body>
</html>
